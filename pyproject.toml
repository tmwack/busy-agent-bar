[project]
name = "agentbar"
version = "0.1.0"
description = "Show coding-agent session state on a BUSY Bar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["busylib>=2.6,<3"]

[project.scripts]
agentbar = "agentbar.cli:main"
agentbar-hook = "agentbar.hook:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbar"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Ruff's defaults (E4, E7, E9, F) plus the widely used extended set.
select = ["E", "W", "F", "I", "B", "BLE", "UP", "SIM", "RUF"]
