[project]
name = "agentbar"
version = "0.1.0"
description = "Show coding-agent session state on a BUSY Bar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["busylib>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentbar = "agentbar.cli:main"
agentbar-hook = "agentbar.hook:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbar"]

[tool.pytest.ini_options]
pythonpath = ["src"]
